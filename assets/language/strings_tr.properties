ability_health=-ONUR MASKELERİ (SAĞLIK):\nSavaşçının yolu affetmez. Hayatın maskelerine bağlıdır. Aldığın her darbe birini parçalar. Son masken de düştüğünde ruhun sonsuza dek hiçlikte dolaşacak.
ability_soul=-KILICIN YOLU (RUH SİSTEMİ):\nÇivin (Nail) savaşa susamış. Düşmanlarına vurduğun her kesin darbeyle onların ruhani yaşam gücünü (RUH) emer, kadim sanatlarını ve büyülerini beslersin.
ability_focus=-KAOSTA MEDİTASYON (ODAK):\nGerçek bir samuray fırtınanın içinde sessizliği bulur. Toplanan RUH'u yönlendirmek, etini iyileştirmek ve parçalanmış bir maskeyi onarmak için ODAK düğmesine basılı tut.
ability_dash=-GÖLGE ADIMI (ATILMA):\nRüzgar gibi ol ve düşman kılıçlarının arasından süzül. Ölümcül darbelerden kaçınmak veya büyük uçurumları geçmek, yıldırım hızıyla hareket etmek için ATILMA düğmesine bas.


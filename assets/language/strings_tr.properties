charm_soul_catcher=«Kılıcın Susuzluğu»\nDüşmana yapılan her başarılı vuruşta, Katana onların ruhani yaşam kanını (RUH) emerek savaşçının içsel kararlılığını besler.
charm_dash_master=«Sınırsız Rüzgar»\nGerçek bir samuray iz bırakmaz. Yıldırım hızındaki kaçınmalarınız (Atılma Bekleme Süresi) arasındaki süre yarıya iner.
charm_unbreakable_strength=«Boyun Eğmez Çeliğin Onuru»\nSavaşçının ruhu silahıyla bütünleşir. Normal Çivi vuruşlarınızın hasarı büyük ölçüde artar.
charm_quick_slash=«Acımasız Katana Dansı»\nDüşmana nefes alacak yer bırakmayan bir vuruş fırtınası. Saldırı bekleme süreniz ortadan kalkar, adeta havayı yararsınız.
charm_quick_focus=«Uğuldayan Fırtınanın Ortasında Meditasyon»\nÖlümcül bir düellonun sıcağında iyileşmek için RUH'u yönlendirmek her zamankinden daha hızlı gerçekleşir. Hareketsiz durup iyileşmek için gereken süre kısalır.
charm_heavy_blow=«Bushido'nun Demir Ağırlığı»\nÇivinizin ezici etkisi düşmanın duruşunu parçalar (Geri İtme) ve onları şiddetli bir fırtınaya kapılmış sonbahar yaprakları gibi savurur.
charm_sharp_shadow=«Hiçlikten Doğan Hayalet»\nAtılmanız sırasında jilet gibi keskin bir gölgeye dönüşün. Düşmanlarınızın etinden süzülerek adımlarınızı uzatırken onları yaralayın.
charm_void_heart=«Hiçliğin Mutlak Zen'i»\nSonsuz karanlıkla bir bütün. Tüm samuray sanatlarınızın (Büyüler) gücü %50 artarak onların kadim, karanlık formlarını uyandırır.


charm_soul_catcher=«Thirst of the Blade»\nWith every successful strike upon the foe, the Katana siphons their spiritual lifeblood (SOUL), fueling the warrior's inner resolve.
charm_dash_master=«The Boundless Wind»\nA true samurai leaves no trace. The intervals between your lightning-fast evasions (Dash Cooldown) are cut in half.
charm_unbreakable_strength=«Honor of Unyielding Steel»\nThe warrior's spirit binds with their weapon. The damage of your regular Nail strikes is heavily augmented.
charm_quick_slash=«The Ruthless Katana Dance»\nA storm of strikes that leaves the opponent no room to breathe. Your attack cooldown vanishes, cleaving the air itself.
charm_quick_focus=«Meditation Amidst the Howling Storm»\nChannelling SOUL to heal in the heat of a fatal duel happens faster than ever. The time required to stand still and mend is shortened.
charm_heavy_blow=«The Iron Weight of Bushido»\nThe crushing impact of your Nail shatters the enemy's stance (Knockback), repelling them like autumn leaves cast into a gale.
charm_sharp_shadow=«Phantom Born of the Abyss»\nBecome a razor-sharp shadow during your dash. Slip through the very flesh of your enemies, wounding them while extending your stride.
charm_void_heart=«Absolute Zen of the Void»\nOne with the eternal darkness. The power of all your samurai arts (Spells) is elevated by 50%, awakening their ancient, dark forms.



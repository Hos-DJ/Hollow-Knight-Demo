ability_health=-MASKS OF HONOR (HEALTH):\nThe path of the warrior is unforgiving. Your life is bound to your masks. Every blow you take shatters one. Let the last mask fall, and your soul shall wander the abyss forever.
ability_soul=-WAY OF THE BLADE (SOUL SYSTEM):\nYour Nail thirsts for combat. With every precise strike upon your foes, you siphon their SOUL. This sacred energy fuels your ancient arts and spells.
ability_focus=-MEDITATION IN CHAOS (FOCUS):\nA true samurai finds stillness in the storm. Hold the FOCUS button to channel the gathered SOUL, mending your flesh and restoring a shattered mask.
ability_dash=-SHADOW STEP (DASH):\nBe as the wind and slip through enemy blades. Press the DASH button to move with lightning speed, evading fatal strikes or crossing great chasms.

